[project]
name = "carepath-interpreter-backend"
version = "0.1.0"
description = "Backend for the CarePath Interpreter MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlmodel>=0.0.22,<1.0",
  "httpx>=0.27,<1.0",
  "anthropic>=0.40,<1.0",
  "openai>=1.50,<2.0",
  "jiwer>=3.0,<5.0",
  "sacrebleu>=2.4,<3.0",
  "rapidfuzz>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.package-data]
app = [
  "glossary/data/*.csv",
  "risk/lexicons/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: tests that call external provider APIs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
