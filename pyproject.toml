[project]
name = "hopegait"
version = "0.1.0"
description = "HopeGait MVP backend: Vietnamese medical ASR correction and SOAP-note drafting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "huggingface-hub>=0.24.0",
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]
training = [
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets[audio]>=2.20.0",
    "evaluate>=0.4.2",
    "jiwer>=3.0.4",
    "peft>=0.12.0",
    "sentencepiece>=0.2.0",
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "trl>=0.9.6",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["hopegait*"]
