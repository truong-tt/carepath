[project]
name = "carepath"
version = "0.1.0"
description = "CarePath MVP backend: Vietnamese medical ASR correction and SOAP-note drafting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "huggingface-hub>=0.24.0",
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]
training = [
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets[audio]>=2.20.0",
    "evaluate>=0.4.2",
    "jiwer>=3.0.4",
    "peft>=0.12.0",
    "pyvi>=0.1.1",
    "sacrebleu>=2.4.0",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.0",
    "torch>=2.3.0",
    "transformers>=4.51.0",
    "trl>=0.9.6",
]
training-fast = [
    "unsloth==2026.7.2",
    "unsloth-zoo==2026.7.2",
    "transformers==4.56.2",
    "trl==0.22.2",
    "datasets[audio]==4.3.0",
]
training-tts = [
    "coqui-tts>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["scribe"]
testpaths = ["scribe/tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scribe/training/notebooks/*.ipynb" = ["E402", "E702"]
"scribe/tests/test_api.py" = ["E402"]
"scribe/tests/test_combined_app.py" = ["E402"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scribe"]
include = ["carepath*"]
