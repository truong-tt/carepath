<!doctype html>
<!-- English, because the landing page is now English by default and the root
     language has to match what is on screen before JS runs. The Vietnamese
     clinician surfaces set lang="vi" from App.tsx on navigation. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CarePath helps foreign patients in Vietnam find care, prepare for the visit, communicate with clinicians, and understand Vietnamese medical paperwork. Anything carrying a dose is withheld until the clinician confirms it."
    />
    <meta name="theme-color" content="#0f2e5c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The same app is served from both Vercel and the Hugging Face Space.
         Without this, the two are duplicate content and Google may index the
         Space URL instead of the public one. -->
    <link rel="canonical" href="https://carepath-medicaltranslation.vercel.app/" />

    <!-- Link previews. This link gets pasted into Zalo and Messenger far more
         often than it gets searched for, and a bare URL reads as unfinished. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarePath" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta property="og:url" content="https://carepath-medicaltranslation.vercel.app/" />
    <meta
      property="og:title"
      content="CarePath — healthcare in Vietnam, without navigating it alone"
    />
    <meta
      property="og:description"
      content="Find care, prepare your visit, understand your Vietnamese prescription. Doses and look-alike drug names are withheld until a clinician confirms them."
    />
    <meta
      property="og:image"
      content="https://carepath-medicaltranslation.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Vietnamese prescription with the English beneath each line; the lines carrying a dose are marked as withheld until a clinician confirms them."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <title>CarePath — healthcare in Vietnam, without navigating it alone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
